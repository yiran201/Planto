<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planto</title>
  <!-- 浏览器标签页图标：直接用侧边栏品牌同一个 🌱 emoji（见
       SidebarNav.vue），data URI 内嵌一个只画一个 emoji 字符的 SVG，
       不需要额外的 .ico/.png 文件、也不需要经过构建流程处理。 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>" />

  <!-- Roboto：Google 系产品的标志性字体，配合 css/variables.css 的
       --font-sans 字体栈使用；没有网络时会自动退回系统无衬线字体。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- 启动加载动效（REQ-030，REQ-045 改为"清新治愈"风格）：纯内联
       <style>，特意不依赖 css/variables.css 里的颜色变量——那份样式表要等
       main.js 里的 JS import 执行之后才会注入，浏览器刚解析到这里时可能
       还没生效，用变量会有一瞬间样式缺失的风险。
       REQ-045：用户要求把原来"黑底 + 转圈 spinner"的加载画面换成"清新
       治愈"风格。判断"治愈感"主要靠浅色柔和渐变背景 + 有生命感的呼吸
       动效，而不是机械的旋转——因此这里的配色是一套独立的浅色柔和调色
       板（薄荷绿/天蓝/米白），刻意不跟随应用当前的深色/浅色主题设置
       （和 REQ-030 时期一样，这个页面在 Vue 挂载、`state.settings.theme`
       还没读到之前就要能显示，本来就没法读取任何应用状态）。视觉元素：
       呼吸光晕 + 缓慢生长的 🌱（呼应侧边栏品牌 emoji，REQ-007 时保留过
       的"Planto 自己的标识"，REQ-084 项目改名后这个"生长/生根"的品牌
       意象反而跟新名字的寓意更贴合了）+ 三颗从光晕里升起又消散的小圆点（花粉/
       尘埃漂浮感）+ 底部三个错峰跳动的加载小圆点（比机械转圈更柔和）。 -->
  <style>
    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      overflow: hidden;
      background: linear-gradient(160deg, #eafaf1 0%, #e7f3fb 55%, #f5f9ec 100%);
      background-size: 220% 220%;
      color: #4d7a68;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px;
      letter-spacing: 0.02em;
      opacity: 0;
      animation: app-loading-in 0.5s ease forwards, app-loading-bg 9s ease-in-out infinite;
      transition: opacity 0.5s ease;
    }
    #app-loading.app-loading--out {
      opacity: 0;
      pointer-events: none;
    }
    #app-loading__halo {
      position: relative;
      width: 104px;
      height: 104px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #app-loading__halo::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(133, 209, 172, 0.5) 0%, rgba(133, 209, 172, 0) 72%);
      animation: app-loading-halo 2.8s ease-in-out infinite;
    }
    #app-loading__sprout {
      position: relative;
      font-size: 42px;
      line-height: 1;
      animation: app-loading-breathe 2.8s ease-in-out infinite;
      filter: drop-shadow(0 6px 10px rgba(76, 175, 128, 0.28));
    }
    .app-loading__particle {
      position: absolute;
      bottom: 40%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8fd6b8;
      opacity: 0;
      animation: app-loading-float 4.2s ease-in infinite;
    }
    .app-loading__particle:nth-child(1) { left: 40%; animation-delay: 0s; }
    .app-loading__particle:nth-child(2) { left: 54%; background: #9ad2ec; animation-delay: 1.4s; }
    .app-loading__particle:nth-child(3) { left: 47%; background: #cfe793; animation-delay: 2.8s; }
    #app-loading__dots {
      display: flex;
      gap: 7px;
    }
    #app-loading__dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6fbf9a;
      animation: app-loading-dot 1.2s ease-in-out infinite;
    }
    #app-loading__dots span:nth-child(2) { animation-delay: 0.15s; }
    #app-loading__dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes app-loading-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes app-loading-bg {
      0%, 100% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
    }
    @keyframes app-loading-breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.08); }
    }
    @keyframes app-loading-halo {
      0%, 100% { transform: scale(0.85); opacity: 0.55; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes app-loading-float {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 0.8; }
      75% { opacity: 0.25; }
      100% { transform: translateY(-64px); opacity: 0; }
    }
    @keyframes app-loading-dot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- REQ-024：应用状态从文件型数据库（OPFS SQLite）异步加载，挂载前有
       一小段等待时间（通常几十到几百毫秒，取决于浏览器加载/初始化
       WASM 的速度）。这里放一个不依赖任何应用 CSS/JS 的加载占位，避免
       用户看到的是一片空白。
       REQ-030：改成 `#app` 的兄弟节点，不再嵌套在 `#app` 内部——嵌套在
       里面的话，Vue `mount('#app')` 会把 `#app` 的全部内容整个替换掉，
       占位元素没有机会做任何淡出过渡就被直接摘掉，视觉上是"啪"一下从
       黑屏硬切到界面。挪成兄弟节点后，`main.js` 才能在挂载完成后手动
       给它加一个淡出用的 class，等 CSS 过渡结束再整个移除，效果是黑色
       加载层平滑淡出、露出下面已经渲染好的界面，而不是硬切黑屏。 -->
  <div id="app-loading">
    <div id="app-loading__halo">
      <span class="app-loading__particle"></span>
      <span class="app-loading__particle"></span>
      <span class="app-loading__particle"></span>
      <span id="app-loading__sprout">🌱</span>
    </div>
    <div id="app-loading__dots"><span></span><span></span><span></span></div>
    <div>正在生长中…</div>
  </div>
  <div id="app"></div>

  <!-- Google API Client（Calendar API 调用本身）。仅用于「设置 → Google
       同步」功能；无网络或未配置 Client ID 时，其余本地排程功能不受
       影响（src/calendar 内已做加载状态判断）。REQ-072：原来这里还有
       一个 Google Identity Services 脚本（accounts.google.com/gsi/client），
       用来做弹窗式 OAuth 登录，已经整个移除——COOP:same-origin（本地
       数据库的硬性前提）会切断弹窗和主页面的通信，导致登录静默失败，
       改成手写的整页跳转式 OAuth2 流程（见
       src/calendar/googleAuthClient.js），不再依赖这个脚本。 -->
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
